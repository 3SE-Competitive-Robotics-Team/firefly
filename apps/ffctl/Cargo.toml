[package]
name = "ffctl"
version = "0.1.0"
keywords = ['cli', 'drone', 'ground-station']
categories = ['command-line-utilities']
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "ffctl"
path = "src/main.rs"

[dependencies]
firefly-error = { workspace = true }
firefly-pubsub = { workspace = true }
iceoryx2 = { workspace = true }
# `completions`：`ffctl completion <shell>` 与 `parse()` 的补全回调（见 usage-rs 文档）
usage = { workspace = true, features = ["completions"] }

[dev-dependencies]
# `test`：`usage::test::command!` 跑真二进制的 CLI 契约测试（tests/cli.rs）
usage = { workspace = true, features = ["test"] }

[lints]
workspace = true
