[package]
name = "ffctl"
version = "0.1.0"
keywords = ['cli', 'drone', 'ground-station']
categories = ['command-line-utilities']
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "ffctl"
path = "src/main.rs"

[dependencies]
firefly-config.workspace = true
firefly-error = { workspace = true }
firefly-pubsub = { workspace = true }
iceoryx2 = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
toml = { workspace = true }
# `completions`：`ffctl completion <shell>` 与 `parse()` 的补全回调；`validation`：字段上的
# `validate` 表达式（见 usage-rs 文档）
usage-rs = { workspace = true, features = ["completions", "validation"] }

[dev-dependencies]
# `test`：`usage_rs::test::command!` 跑真二进制的 CLI 契约测试（tests/cli.rs）
usage-rs = { workspace = true, features = ["test"] }

[lints]
workspace = true
