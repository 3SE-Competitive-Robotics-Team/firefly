[project]
name = "firefly-sim"
version = "0.1.0"
description = "MuJoCo 物理环境主循环：RMUC 物理与 IMU、订阅电机推力"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "firefly-mujoco",
    "iceoryx2==0.10.0",
    "numpy>=2.5.3,<3",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
]

[tool.uv.sources]
firefly-mujoco = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[project.scripts]
firefly-sim = "firefly_sim.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
]
