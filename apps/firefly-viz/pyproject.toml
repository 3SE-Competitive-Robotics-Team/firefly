[project]
name = "firefly-viz"
version = "0.1.0"
description = "rerun 统一写入进程：订阅 Firefly/Viz 话题，写共享 viewer 或离线 rrd"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "firefly-mujoco",
    "iceoryx2==0.10.0",
    "numpy>=2.5.3,<3",
    "rerun-sdk>=0.38.1,<0.39",
]

[tool.uv.sources]
firefly-mujoco = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[project.scripts]
firefly-viz = "firefly_viz.main:main"
