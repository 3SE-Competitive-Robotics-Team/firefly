[project]
name = "firefly-viz"
version = "0.1.0"
description = "独立 Rerun 调试进程：诊断、H.265 左目视频、采样与事件窗口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "firefly-workspace",
    "firefly-mujoco",
    "iceoryx2==0.10.0",
    "numpy>=2.5.4,<3",
    "pyarrow>=26.0.0",
    "rerun-sdk>=0.38.1,<0.39",
]

[tool.uv.sources]
firefly-workspace = { workspace = true }
firefly-mujoco = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project.scripts]
firefly-viz = "firefly_viz.main:main"
