[workspace]
members = ["crates/*", "apps/*", "xtask"]
exclude = ["apps/firefly-sim"]
resolver = "3"

[workspace.dependencies]
re_build_info = "=0.42.0"
re_byte_size = "=0.42.0"
re_chunk = "=0.42.0"
re_log_encoding = { version = "=0.42.0", features = ["encoder", "decoder"] }
re_log_msg = "=0.42.0"
re_log_types = "=0.42.0"
re_sdk_types = { version = "=0.42.0", default-features = false }
firefly-ego-map = { path = "crates/firefly-ego-map" }
firefly-calibration = { path = "crates/firefly-calibration" }
firefly-basalt = { path = "crates/firefly-basalt" }
firefly-rootslam-mapping = { path = "crates/firefly-rootslam-mapping" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
firefly-opengv = { path = "crates/firefly-opengv" }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg", "sparse-linalg"] }
num-complex = "0.4.6"
firefly-config = { path = "crates/firefly-config" }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
signal-hook = "0.4.6"
firefly-base = { path = "crates/firefly-base" }
bevy = "0.20.1"
fastrace = { version = "0.7.19", default-features = false }
iceoryx2 = "0.10.0"
iceoryx2-bb-posix = "0.10.0"
jiff = "0.2.41"
log = "0.4.35"
logcall = "0.2.1"
logforth = { version = "0.30.1", default-features = false }
nalgebra = "0.35.0"
ndarray = "0.17.2"
nusb = "0.2.9"
# `fs` 是 `nix::fcntl` 的门控 feature，板端 `camera --hil` 用它设 O_NONBLOCK；
# 少了它只有全 workspace 构建（feature 被别的 crate 统一打开）能过，单包构建会失败。
nix = { version = "0.31.3", features = ["signal", "process", "feature", "term", "fs"] }
ort = { version = "=2.0.0-rc.15" }
purecv = { version = "0.12.0", default-features = false, features = ["simd", "parallel"] }
rand = "0.10.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
spidev = "0.7.1"
toml = "1.2.1"
usage-rs = "7.3.0"
v4l = "0.14.0"
zstd = "0.14.3"
firefly-cost = { path = "crates/firefly-cost" }
firefly-error = { path = "crates/firefly-error" }
firefly-hal = { path = "crates/firefly-hal" }
firefly-hil = { path = "crates/firefly-hil" }
firefly-imu = { path = "crates/firefly-imu" }
firefly-imu-initialization = { path = "crates/firefly-imu-initialization" }
firefly-imu-propagation = { path = "crates/firefly-imu-propagation" }
firefly-vio-runtime = { path = "crates/firefly-vio-runtime" }
firefly-flight = { path = "crates/firefly-flight" }
firefly-map = { path = "crates/firefly-map" }
firefly-observability = { path = "crates/firefly-observability" }
firefly-optimize = { path = "crates/firefly-optimize" }
firefly-planner = { path = "crates/firefly-planner" }
firefly-pubsub = { path = "crates/firefly-pubsub" }
firefly-localization = { path = "crates/firefly-localization" }
firefly-search = { path = "crates/firefly-search" }
firefly-trajectory = { path = "crates/firefly-trajectory" }
firefly-vision-map = { path = "crates/firefly-vision-map" }
firefly-vision-match = { path = "crates/firefly-vision-match" }
firefly-render = { path = "crates/firefly-render" }

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
description = "RoboMaster 无人机自主导航：视觉惯性定位、建图、轨迹规划与飞行控制"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3SE-Competitive-Robotics-Team/firefly"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = 1 }
pedantic = { level = "deny", priority = 1 }
cargo = { level = "warn", priority = 1 }
# 数值代码中的受控索引转换（索引 ≤ 6、维度检查后的体素索引等），覆盖组默认
cast_possible_truncation = { level = "allow", priority = 2 }
cast_possible_wrap = { level = "allow", priority = 2 }
cast_precision_loss = { level = "allow", priority = 2 }
cast_sign_loss = { level = "allow", priority = 2 }
# 上游传递依赖版本分叉（syn/glam/bitflags），非本仓库可控
multiple_crate_versions = { level = "allow", priority = 2 }
# 测试逐位校验协议/解析浮点值，断言相等是有意的；生产代码浮点比较由 review 保证
float_cmp = { level = "allow", priority = 2 }
