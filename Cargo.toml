[workspace]
members = ["crates/*", "apps/*", "xtask"]
exclude = ["apps/firefly-sim", "apps/firefly-viz"]
resolver = "3"

[workspace.dependencies]
firefly-config = { path = "crates/firefly-config" }
firefly-landmarks = { path = "crates/firefly-landmarks" }
serde_json = "1.0.154"
signal-hook = "0.3"
firefly-base = { path = "crates/firefly-base" }
bevy = "0.20.0"
fastrace = { version = "0.7.19", default-features = false }
iceoryx2 = "0.10.0"
iceoryx2-bb-posix = "0.10.0"
jiff = "0.2.38"
log = "0.4.34"
logcall = "0.2.1"
logforth = { version = "0.30.1", default-features = false }
nalgebra = "0.35.0"
ndarray = "0.17.2"
nix = { version = "0.31", features = ["signal", "process", "feature", "term"] }
ort = { version = "=2.0.0-rc.14" }
purecv = { git = "https://github.com/XiaoPengYouCode/purecv.git", rev = "e07b882e792a3c7221178d5163d9ed2eaba92a92", default-features = false, features = ["simd", "parallel"] }
rand = "0.10.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
spidev = "0.7.1"
toml = "1.1.8"
usage-rs = "7.0.2"
v4l = "0.14.0"
zstd = "0.13"
firefly-cost = { path = "crates/firefly-cost" }
firefly-error = { path = "crates/firefly-error" }
firefly-hal = { path = "crates/firefly-hal" }
firefly-imu = { path = "crates/firefly-imu" }
firefly-flight = { path = "crates/firefly-flight" }
firefly-vio-core = { path = "crates/firefly-vio-core" }
firefly-vio-types = { path = "crates/firefly-vio-types" }
firefly-vio-init = { path = "crates/firefly-vio-init" }
firefly-vio = { path = "crates/firefly-vio" }
firefly-map = { path = "crates/firefly-map" }
firefly-observability = { path = "crates/firefly-observability" }
firefly-optimize = { path = "crates/firefly-optimize" }
firefly-planner = { path = "crates/firefly-planner" }
firefly-pubsub = { path = "crates/firefly-pubsub" }
firefly-localization = { path = "crates/firefly-localization" }
firefly-search = { path = "crates/firefly-search" }
firefly-trajectory = { path = "crates/firefly-trajectory" }
firefly-vision-map = { path = "crates/firefly-vision-map" }
firefly-vision-match = { path = "crates/firefly-vision-match" }
firefly-render = { path = "crates/firefly-render" }

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
description = "EGO 规划器 Rust 实现：MINCO 后端 + Rebound 主循环 + 集群避碰"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3SE-Competitive-Robotics-Team/firefly"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = 1 }
pedantic = { level = "deny", priority = 1 }
cargo = { level = "warn", priority = 1 }
# 数值代码中的受控索引转换（索引 ≤ 6、维度检查后的体素索引等），覆盖组默认
cast_possible_truncation = { level = "allow", priority = 2 }
cast_possible_wrap = { level = "allow", priority = 2 }
cast_precision_loss = { level = "allow", priority = 2 }
cast_sign_loss = { level = "allow", priority = 2 }
# 上游传递依赖版本分叉（syn/glam/bitflags），非本仓库可控
multiple_crate_versions = { level = "allow", priority = 2 }
# 测试逐位校验协议/解析浮点值，断言相等是有意的；生产代码浮点比较由 review 保证
float_cmp = { level = "allow", priority = 2 }
