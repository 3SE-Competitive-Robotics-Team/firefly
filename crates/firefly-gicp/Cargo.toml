[package]
name = "firefly-gicp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "small-gicp 忠实纯 Rust 移植（ICRA 2024）：points/util/ann/factors/registration，rayon 并行，nalgebra 运算"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gicp", "icp", "point-cloud", "kdtree", "robotics"]
categories = ["science", "mathematics", "robotics", "simulation"]

[dependencies]
fastrace = { workspace = true }
nalgebra = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "kdtree_bench"
harness = false

[[bench]]
name = "downsampling_bench"
harness = false

[[bench]]
name = "registration_bench"
harness = false

[lints.rust]
unsafe_code = { level = "forbid", priority = 1 }

[lints.clippy]
all = { level = "deny", priority = 1 }
pedantic = { level = "deny", priority = 1 }
cargo = { level = "warn", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 2 }
cast_possible_wrap = { level = "allow", priority = 2 }
cast_precision_loss = { level = "allow", priority = 2 }
cast_sign_loss = { level = "allow", priority = 2 }
multiple_crate_versions = { level = "allow", priority = 2 }
too_many_arguments = { level = "allow", priority = 10 }
needless_range_loop = { level = "allow", priority = 10 }
type_complexity = { level = "allow", priority = 10 }
module_inception = { level = "allow", priority = 10 }
multiple_bound_locations = { level = "allow", priority = 10 }
field_reassign_with_default = { level = "allow", priority = 10 }
