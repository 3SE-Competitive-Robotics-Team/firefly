# Python workspace 聚合包。

[project]
name = "firefly"
version = "0.1.0"
description = "firefly 双语言 monorepo：Rust（EGO 规划 + RootSLAM）+ Python（MuJoCo 物理环境）"
requires-python = ">=3.12"
dependencies = [
    "firefly-workspace",
    "firefly-ipc",
    "firefly-mujoco",
    "firefly-sim",
]

[tool.uv.sources]
firefly-workspace = { workspace = true }
firefly-ipc = { workspace = true }
firefly-mujoco = { workspace = true }
firefly-sim = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/firefly/firefly-sim"]

[dependency-groups]
docs = ["zensical==0.1.3"]
dev = [
    "pytest>=9.2.0",
    "psutil>=7.2.2,<8",
    "rerun-sdk>=0.44.0,<0.45",
    "trimesh>=5.2.2",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/firefly", "packages"]
