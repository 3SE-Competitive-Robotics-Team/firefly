[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt (CI: cargo fmt --all --check)",
    language = "system",
    entry = "cargo fmt --all --check",
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy (CI: cargo clippy --all-targets -- -D warnings)",
    language = "system",
    entry = "cargo clippy --all-targets -- -D warnings",
    pass_filenames = false,
  },
  {
    id = "cargo-test",
    name = "cargo test (CI: cargo test --all-targets --release)",
    language = "system",
    entry = "cargo test --all-targets --release",
    pass_filenames = false,
  },
]
