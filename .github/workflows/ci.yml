name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: main
          filters: |
            code:
              - '**'
              - '!docs/**'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bevy/winit Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Rust/Python IPC compatibility
        run: |
          uv sync --locked --package firefly-ipc --no-dev
          .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('mujoco') is None"
          .venv/bin/python scripts/hil_hover_monitor.py --seconds 0
          cargo test -p firefly-pubsub --test python_interop -- --ignored

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Test Python workspace
        run: uv run --all-packages --extra test pytest -q -p no:cacheprovider
