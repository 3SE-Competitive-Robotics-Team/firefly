name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bevy/winit Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Rust/Python IPC compatibility
        run: |
          uv sync --package firefly-sim --no-dev
          FIREFLY_TEST_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test -p firefly-pubsub --test python_interop -- --ignored

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Test simulation and evaluation
        run: uv run --all-packages --extra test pytest -q -p no:cacheprovider
