[project]
name = "firefly-evaluation"
version = "0.1.0"
description = "任务验收编排、进程生命周期、RRD 证据评分与报告"
requires-python = ">=3.12"
dependencies = [
    "firefly-workspace",
    "firefly-mujoco",
    "firefly-sim",
    "iceoryx2==0.10.0",
    "numpy>=2.5.4,<3",
    "pyarrow>=26.0.1",
    "psutil>=7.2.2,<8",
    "rerun-sdk>=0.42.0,<0.43",
]

[tool.uv.sources]
firefly-workspace = { workspace = true }
firefly-mujoco = { workspace = true }
firefly-sim = { workspace = true }

[project.scripts]
firefly-evaluate = "firefly_evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
