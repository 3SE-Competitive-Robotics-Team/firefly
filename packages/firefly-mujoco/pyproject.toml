[project]
name = "firefly-mujoco"
version = "0.1.0"
description = "MuJoCo 物理环境库：RMUC 无人机场景 + IMU 提取"
authors = [
    { name = "XiaoPengYouCode", email = "120481176+XiaoPengYouCode@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.11,<4",
    "numpy>=2,<3",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
