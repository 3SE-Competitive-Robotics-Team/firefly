[project]
name = "firefly-mujoco"
version = "0.1.0"
description = "MuJoCo 物理环境库：RMUC 无人机场景 + IMU 提取"
authors = [
    { name = "XiaoPengYouCode", email = "120481176+XiaoPengYouCode@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "firefly-workspace",
    "mujoco>=4.0.0,<5",
    "numpy>=2.5.4,<3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
firefly-workspace = { workspace = true }
