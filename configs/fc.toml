# firefly-fc 配置（缺键回落代码默认值：`apps/fc/src/config.rs` + `firefly-flight`）
# 机体/执行器参数（质量、惯量、旋翼几何、单电机推力上限）不在这里：由被控对象经
# `Firefly/Airframe` 发布，飞控运行时装配——改机体不动飞控。

# VIO 送来的角速度是未滤波的原始陀螺：20~30 Hz 的旋翼振动会原样进速率环，把力矩
# 需求顶到混控器满量程之外触发饱和，饱和再经 airmode 解饱和变成推力尖峰。
# 真实运动在 0~5 Hz，10 Hz 一阶低通只压振动、不动飞行包线；0 = 不滤波。
rate_measurement_lpf_hz = 10.0
# 测量角速度幅值上限（rad/s）：单点野值不得原样变成力矩指令；0 = 不限幅。
rate_measurement_limit_rad_s = 20.0

[control.position]
# PX4 `MPC_*`：位置 P、速度 PID、速度/倾角包线。
# 位置反馈来自 VIO。vel_p 由 PX4 默认 1.8 提到 2.4，使等效位置增益
# pos_p·vel_p≈2.28 与旧 PD 的 2.2 对齐，压低 1m 阶跃超调（约 10%→4%）。
p = [0.95, 0.95, 1.0]
vel_p = [2.4, 2.4, 4.0]
vel_i = [0.4, 0.4, 2.0]
vel_max_horizontal = 3.0
tilt_max_deg = 32.0

[control.allocation]
# 1 = 滚转/俯仰 airmode：垂直推力饱和时保留姿态权限。
airmode = 1

# [fsm]
# 起降垂直参考由 VelocitySmoothing 生成；以下为覆盖默认值的示例。
# takeoff_accel = 1.0
# takeoff_jerk = 4.0
# land_accel = 0.8
