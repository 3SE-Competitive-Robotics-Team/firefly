# USB HIL：完整估计、规划与控制链路自启动，执行器推力回传主机仿真。

[[process]]
name = "camera"
command = ["taskset", "-c", "0-4", "bin/camera", "--hil"]
autostart = true

[[process]]
name = "motor"
command = ["taskset", "-c", "0-4", "bin/motor", "--hil"]
autostart = true

[[process]]
name = "firefly-rootslam"
# RootSLAM 只用双目 + IMU；局部深度地图由 planner 独立维护。
command = ["taskset", "-c", "6,7", "env", "RAYON_NUM_THREADS=2", "bin/firefly-rootslam", "--no-loop-closures", "--no-mapping", "--config", "configs/rootslam-hil.toml"]
autostart = true

[[process]]
name = "fc"
command = ["taskset", "-c", "5", "bin/fc", "--config", "configs/fc-hil.toml"]
autostart = true

[[process]]
name = "landing"
command = ["taskset", "-c", "4", "bin/landing"]
autostart = true

[[process]]
name = "traj"
command = ["taskset", "-c", "0-4", "bin/traj"]
autostart = true

[[process]]
name = "planner"
command = ["taskset", "-c", "0-4", "bin/planner"]
autostart = true

[[process]]
name = "depth"
command = ["taskset", "-c", "3", "bin/depth"]
autostart = true
