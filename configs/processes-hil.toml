# USB HIL：板端 RootSLAM 与 FC 计算，执行器推力回传主机仿真。

[[process]]
name = "camera"
command = ["bin/camera", "--hil"]
autostart = true

[[process]]
name = "motor"
command = ["bin/motor", "--hil"]
autostart = true

[[process]]
name = "firefly-rootslam"
# HIL 先验证估计/控制闭环：关掉回环与建图，避免板端初始化阻塞 IMU 队列。
# RootSLAM 只用双目 + IMU，不消费深度，与 HIL 的 depth=false 一致。
command = ["bin/firefly-rootslam", "--no-loop-closures", "--no-mapping", "--config", "configs/rootslam-hil.toml"]
autostart = true

[[process]]
name = "fc"
command = ["taskset", "-c", "6,7", "bin/fc", "--config", "configs/fc-hil.toml"]
autostart = true

[[process]]
name = "traj-server"
command = ["bin/planner", "--traj-server"]
autostart = false

[[process]]
name = "planner"
command = ["bin/planner"]
autostart = false
