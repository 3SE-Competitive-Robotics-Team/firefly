# 主机侧 USB HIL 桥（apps/hil）；默认值见 src/config.rs。
# 板端 gadget 由 `hil-gadget up` 建立，接口/端点按描述符自动发现。

[usb]
# HIL gadget 沿用镜像预置的 adb VID/PID 与序列号，便于 `adb`/nusb 同时匹配。
vendor = 0x18d1
product = 0x0002
serial = "firefly-0001"
subclass = 1

[link]
# 单次 USB 传输量：图像按 16KiB 分片，避免一张图挡住 IMU/控制。
read_buffer = 65536
write_buffer = 16384
# 逐样本下发，控制板端 IMU 队列的突发量。
imu_batch = 1
image_queue = 4
# 双目、深度与 CIF 下视最多按 30Hz 下发，完整规划链路持续接收深度。
image_period_s = 0.03333333333333333
