[[process]]
name = "camera"
command = ["taskset", "-c", "1", "bin/camera"]
autostart = false

[[process]]
name = "firefly-rootslam"
command = ["taskset", "-c", "6,7", "env", "RAYON_NUM_THREADS=2", "bin/firefly-rootslam"]
autostart = true

[[process]]
name = "pilot"
command = ["taskset", "-c", "1", "bin/pilot"]
autostart = true

[[process]]
name = "landing"
command = ["taskset", "-c", "4", "bin/landing"]
autostart = true

[[process]]
name = "localization"
command = ["taskset", "-c", "4", "bin/localization"]
autostart = false

[[process]]
name = "traj"
command = ["taskset", "-c", "4", "bin/traj"]
autostart = true

[[process]]
name = "planner"
command = ["taskset", "-c", "2,4", "bin/planner"]
autostart = true

[[process]]
name = "depth"
command = ["taskset", "-c", "3", "bin/depth"]
autostart = true
