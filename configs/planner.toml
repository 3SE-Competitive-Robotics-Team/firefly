# planner 配置（EGO-Planner-v2 对齐；缺键回落代码默认值，`--config` 可换文件）
# 顶层 = PlannerConfig（论文 Table S6），[manager] = 管理器行为参数

piece_length = 1.5
constraint_points_per_piece = 5
planning_distance = 7.5
# 车体安全半径（米）：**唯一的可行性判据**。地图膨胀、A* 搜索、细检、代价硬阈值
# 全部用它（地图膨胀经 `MapFile::to_grid_map` 传入，不再有隐藏默认值）。低于它的
# 通道一律不可通行——否则 A* 会搜出连续轨迹跟不上的窄缝（全局搜得到、局部飞不了）。
obstacle_clearance = 0.4
# 舒适带（米）：代价里"离障碍多远才舒服"的**调参偏好**，与可行性无关。它提供把
# 轨迹推离障碍的梯度——窄通道里能否"自己让开"取决于它。
obstacle_clearance_soft = 0.5
weight_obstacle_soft = 5000.0 # 官方 v2 `weight_obstacle_soft`
swarm_clearance = 0.5
max_velocity = 1.5
max_acceleration = 6.0
max_jerk = 10.0
weight_smoothness = 1.0
weight_time = 10.0
weight_feasibility = 10000.0
weight_obstacle = 10000.0
weight_swarm = 10000.0
weight_formation = 100.0
weight_sqrvariance = 10000.0
# 虚拟地面/天花板（米，世界坐标 z；官方 `enable_virtual_wall` +
# `virtual_ground`/`virtual_ceil`，launch advanced_param.xml 实际值）
virtual_ground = -0.1
virtual_ceiling = 3.0
# 偏航保持（本项目扩展）：横飞时锁定起飞朝向，不跟速度方向、角速度恒零。
# 关掉会让机体随航向连续转弯，机动中视觉/VIO 与推力分配都更难。
yaw_hold = true

[manager]
replan_thresh = 1.0 # 秒
planning_horizon = 6.0 # 米
arrive_dist = 0.5 # 米
