# planner 配置（EGO-Planner-v2 对齐；缺键回落代码默认值，`--config` 可换文件）
# 顶层 = PlannerConfig（论文 Table S6），[manager] = 管理器行为参数
# [mapping]：planner 独立融合 Depth + 机体 Odometry + 相机外参，维护局部概率占据图。
# [mapping.depth] 标定默认取 firefly_base::rig，部署可覆盖光学内参和 body←camera 外参。

yaw_hold = true
# 障碍净距（米）：地图膨胀、A*、轨迹细检和障碍代价硬阈值共用。
obstacle_clearance = 0.4
# 作业高度边界（米，地图 z）；默认会话地图以静止启动位置为零。
# 这是任务范围约束，不提供场地定位或地形。目标和范围均使用局部 odom 坐标。
virtual_ground = -0.505
virtual_ceiling = 2.195
