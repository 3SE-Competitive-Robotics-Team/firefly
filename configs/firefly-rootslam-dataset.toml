# RootSLAM dataset runner. Paths are relative to the workspace root.
# Numerical defaults are defined by the application and mapping crate.
dataset_path = "../basalt/build/datasets/euroc/MH_01_easy"
dataset_type = "euroc"
camera_calibration = "../basalt/data/euroc_ds_calib.json"
vio_config = "../basalt/data/euroc_config.json"
trajectory = "logs/rootslam_trajectory.txt"
metrics_path = "logs/rootslam_metrics.json"
global_result_path = "logs/rootslam_global_result.json"

[optimization]
problem_archive = "logs/rootslam_global_problem.json"
# The paper runs the whole global optimization in single precision. Uncomment
# both lines to reproduce that configuration; the default stays double
# precision because the single-precision path could not be validated against a
# dataset in this repository.
# precision = "float32"
# krylov_precision = "native"

# Optional map policy. All fields are required when the section is present.
# The pose-graph residual scale is the paper's `S_ab`, whose values were not
# published; leaving it unset derives it from the camera model.
# [map_policy]
# redundancy_fraction = 0.9
# redundant_observers = 3
# max_keyframes = 1500
# cull_batch = 30
# The paper leaves the strong-covisibility threshold unspecified; this example
# keeps the edges shared by at least four keyframes.
# essential_min_shared = 4
# [map_policy.edge_information]
# reference_depth_m = 5.0
