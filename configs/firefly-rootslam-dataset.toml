# Run with firefly-rootslam --config configs/firefly-rootslam-dataset.toml.
# Paths are relative to the working directory; download and extract the ASL archive first.
precision = "float64"

[input]
type = "dataset"
format = "lamaria"
path = "../../lamaria/datasets/training/R_01_easy/asl_folder/R_01_easy"
calibration = "../../lamaria/datasets/training/R_01_easy/pinhole_calibrations/R_01_easy.json"

[vio]
optical_flow_detection_grid_size = 20
map = true
loops = true

[dataset]
trajectory = "logs/rootslam_trajectory.txt"
local_trajectory = "logs/rootslam_local_trajectory.txt"
trajectory_format = "lamaria"
global_result_path = "logs/rootslam_global_result.json"
global_optimization = true
# LaMAria pGT stays outside estimation; use its official evaluator on this trajectory.
