# Calibrated 512x512, 16-bit EuRoC export; run from the workspace root.
precision = "float64"

[input]
type = "dataset"
format = "euroc"
path = "datasets/tumvi/dataset-room1_512_16"
calibration = "../../basalt/data/tumvi_512_eucm_calib.json"

[vio]
optical_flow_detection_grid_size = 20
map = true
loops = true

[dataset]
trajectory = "logs/tumvi_trajectory.txt"
local_trajectory = "logs/tumvi_local_trajectory.txt"
metrics_path = "logs/tumvi_metrics.json"
global_result_path = "logs/tumvi_global_result.json"
global_optimization = true
