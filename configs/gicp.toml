# GICP 全局重定位配置（firefly-localization，缺键回落代码默认值）
# 用法：planner --config configs/gicp.toml 或合入 configs/planner.toml 的 [reloc]/[fusion] 段

[reloc]
downsampling_resolution = 0.1 # m，靶图体素降采样（0.2 量化薄壁结构引入厘米级偏差；0.1 靶约 3 万点，1Hz 配准仍充裕）
num_neighbors = 10 # 近邻数（法向/协方差）
max_correspondence_distance = 2.0 # m，最大对应距离（原 1.0，容忍更大初值漂移）
max_iterations = 20
voxel_resolution = 1.0 # m，VGICP 体素（未启用时占位）

[fusion]
process_noise_rot = 0.0000001 # rad²，单步过程噪声旋转（odom 100Hz：按秒等效 1e-5，与 10Hz 时 1e-6 同量级）
process_noise_pos = 0.00001 # m²，单步过程噪声平移（odom 100Hz：按秒等效 1e-3）
process_noise_pos_per_m = 0.04 # m²/m，里程过程噪声平移（覆盖 ~5%/m 系统性漂移@1σ；20m 后 P_std≈0.9m）
fallback_noise_rot = 0.0019 # rad²，h 不可逆回退（2.5°）
fallback_noise_pos = 0.04 # m²，h 不可逆回退（0.2m）
chi2_multiplier = 1.0 # chi2 阈值乘子（取 1 即 chi2_95(6)=12.6 原教旨名义 5% 误拒率）
min_inlier_ratio = 0.3 # 最小内点率（原 0.5，放宽以通过稀疏场景）
min_num_inliers = 30
max_registration_error = 1000000000.0 # 最大配准残差和
# [fusion.gicp] 几何路径画像（紧门）：GICP 走廊混叠风险高，厘米级漂移外即视为误锁，单步注入钳制防跳变
[fusion.gicp]
max_innovation_trans = 0.3 # m，新息限幅平移（局部跟踪档）
max_innovation_rot = 0.08726646259971647 # rad，新息限幅旋转（5°）
max_correction_trans = 0.5 # m，单次修正限幅平移
max_correction_rot = 0.08726646259971647 # rad，单次修正限幅旋转（5°）
# [fusion.visual] 特征验证路径画像（VINS 尺度 sanity）：验证在观测产生侧已完成，接受即全量应用后验，限幅只拦荒谬值
[fusion.visual]
max_innovation_trans = 20.0 # m（对照 VINS-Fusion findConnection 的 20m）
max_innovation_rot = 0.5235987755982988 # rad（30°，对照 VINS-Fusion 的 30°）
max_correction_trans = 20.0 # m（全量应用，钳制+P 收缩互锁会导致残差 perpetual）
max_correction_rot = 0.5235987755982988 # rad（30°）
r_floor_rot = 0.0003 # rad²，R 下限旋转（好修正噪声~1°，防 h⁻¹ 过自信）
r_floor_pos = 0.005 # m²，R 下限平移（好修正噪声~0.07m）
p_init_rot = 0.0027 # rad²，P 初值旋转（3°）
p_init_pos = 0.01 # m²，P 初值平移（真值初始化，漂移从零起）
auto_scale_factor = 2.0 # 连续拒收后 R 放大倍数
auto_scale_trigger = 3 # 触发放大的连续拒收次数
