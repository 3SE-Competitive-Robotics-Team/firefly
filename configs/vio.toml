# VIO 配置（RMUC render 双目部署；缺键回落代码默认值，`--config` 可换文件）

[camera]
width = 320
height = 240
focal = 168.607 # MuJoCo fovy=70.88° 推导；真机换标定值
baseline = 0.05 # 米，IMU 居中

[imu]
gyro_noise = 2.0e-4 # rad/s/√Hz；每采样 σ=0.002、100 Hz，σ_density=σ_sample/√fs
gyro_walk = 1.9e-5
accel_noise = 2.0e-3 # m/s²/√Hz；每采样 σ=0.02、100 Hz
accel_walk = 3.0e-3

[frontend]
num_pts = 300 # 每相机 KLT 目标特征数

[estimator]
max_baseline = 120 # 三角化深度/基线比上限（OpenVINS 默认 40）

[slam]
# 体素选点（Voxel-SVIO）：每帧只喂相机可见体素内的路标。参数对照官方调参
# （EuRoC/TUM-VI）：voxel_size 0.3、nb_voxels_visited 2、min_distance_points 0.0。
# 代码默认 0.1/±1 的邻域只有 ±0.1m，在真实特征间距（~0.3m）下几乎命中不了。
voxel_selection = true
voxel_size = 0.3
neighbor_radius = 2
min_point_distance = 0.0
