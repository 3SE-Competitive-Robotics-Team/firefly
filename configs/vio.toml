# VIO 配置（RMUC render 双目部署；缺键回落代码默认值，`--config` 可换文件）

[slam]
# 体素地图（Voxel-SVIO）：`VoxelMap` 维护路标、`ActiveTrackTriangulator` 跨帧累积，
# 每帧只喂相机可见体素内的点进 MSCKF 更新。开关同时启用整条体素通路
# （`apps/vio` 里 `voxel_options.enabled` 取自 `voxel_selection`）。
# 参数对照官方 EuRoC 配置：voxel_size/nb_voxels_visited/min_distance_points/
# max_num_points_in_voxel/max_slam = 0.3/2/0.0/5/100。
voxel_selection = true
voxel_size = 0.3
neighbor_radius = 2
min_point_distance = 0.0
max_slam_features = 100
