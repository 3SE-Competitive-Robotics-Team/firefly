# apps/render 传感器相机视觉配置。主视角照明/曝光/bloom 在 firefly-render 的
# 共享效果里（与 apps/quad 同源），不在此配置；场景在 configs/scene.toml。
# 改动这里即可调传感器画面，不必重编译。
[light]
# 传感器相机三方向光照度（lux）：与 IBL + 灯阵叠加，决定发布图像亮度，
# 须让灰度均值落 120~170/255（VIO 特征密度下限）。
directional = [18000.0, 12000.0, 8000.0]

[light.grid]
# 顶棚灯阵：rows × cols 盏点光源，营造场馆照明。点光源平方反比衰减，
# intensity（流明）与 range（米）须一起调，range 偏小会出现"光斑"硬边；
# 全部不投阴影（一盏点光阴影 = 6 面 cubemap，数十盏会压垮渲染）。
# 只作用于传感器相机（主视角不吃灯阵）。
rows = 4
cols = 8
height = 4.0
intensity = 300000.0
range = 12.0
span = [28.0, 14.0]
color = [1.0, 0.97, 0.92]

[view]
# 传感器相机曝光 EV100（越大越暗）：以发布图像灰度均值为准，
# 须落在 120~170/255（KLT 特征密度下限），否则 VIO 前端无特征可跟。
# 该值与场地材质/灯光一起决定均值，换场地后须按实拍均值复核。
sensor_ev100 = 12.0

[env]
# 环境光贴图（IBL，半球渐变"天空"）：近黑高光面没有可反射的环境会像"吸光"，
# 这张渐变同时提供暗部补光与柔和反射。颜色 sRGB 0~1，intensity 缩放后单位 cd/m²。
# 色相接近中性（蓝只略高），避免给整场叠加蓝色偏移。只作用于传感器相机。
top = [0.72, 0.74, 0.78]
mid = [0.45, 0.46, 0.49]
bottom = [0.14, 0.14, 0.15]
intensity = 3000.0
