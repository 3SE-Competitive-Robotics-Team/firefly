# apps/render 视觉配置：场景光照（所有视角共用一份）+ 相机曝光。
# 场景在 configs/scene.toml。
[light]
# 场景三方向光照度（lux）：与相机曝光一起决定画面亮度。
directional = [18000.0, 12000.0, 8000.0]

[view]
# 传感器相机曝光 EV100（越大越暗）：以发布图像灰度均值为准，须落 120~170/255
#（KLT 特征密度下限）；该值与场地材质/灯光一起决定均值，换场地后按实拍复核。
sensor_ev100 = 12.0
# 主视角曝光 EV100：省略 = 与 sensor_ev100 一致（debug 窗口与发布图像同观感）。
# ev100 = 12.0

[env]
# 场景 IBL（半球渐变"天空"）：近黑高光面没有可反射的环境会像"吸光"，
# 这张渐变同时提供暗部补光与柔和反射。颜色 sRGB 0~1，intensity 缩放后单位 cd/m²。
# 色相接近中性（蓝只略高），避免给整场叠加蓝色偏移。
top = [0.72, 0.74, 0.78]
mid = [0.45, 0.46, 0.49]
bottom = [0.14, 0.14, 0.15]
intensity = 3000.0
