# apps/render 视觉配置（只管光照/相机；场景在 configs/scene.toml，与 sim/viz 共用）。
# 改动这里即可调画面，不必重编译。若画面惨白，先查 ev100 与 directional 是否同量级。
[light]
# 全局环境光（cd/m²，Bevy 缺省 80）：IBL 之外的兜底补光。
ambient = 30.0
# 三方向光照度（lux）：整体基调（场馆顶光），压在 IBL + 灯阵之上一起生效。
directional = [18000.0, 12000.0, 8000.0]

[light.grid]
# 顶棚灯阵：rows × cols 盏点光源，营造场馆照明。点光源平方反比衰减，
# intensity（流明）与 range（米）须一起调，range 偏小会出现"光斑"硬边；
# 全部不投阴影（一盏点光阴影 = 6 面 cubemap，数十盏会压垮渲染）。
rows = 4
cols = 8
height = 4.0
intensity = 300000.0
range = 12.0
span = [28.0, 14.0]
color = [1.0, 0.97, 0.92]

[light.shadow]
# 方向光阴影（CascadeShadowConfig）。阴影按视角逐份渲染，成本 ≈ 视角数 × 阴影灯数
# × 级联数；Bevy 默认 4 级联 / maximum_distance=150（对齐 Unity/Unreal 大世界），
# 在 30m 场地里是纯浪费。参照官方示例 examples/3d/lighting.rs（小场景取
# maximum_distance=10），这里收紧到近场。
enabled = true
cast_lights = 1
num_cascades = 1
maximum_distance = 20.0
first_cascade_far_bound = 10.0

[view]
# 主视角曝光 EV100（越大越暗）：必须与 directional 的量级匹配。
# 参照：日光 15 / 阴天 12 / 室内 7；Bevy 缺省（室内量级）9.7。
# 取 12（≈阴天量级）：与 directional、IBL、灯阵一起定调整体亮度。
ev100 = 12.0
# 传感器相机曝光 EV100（独立于主视角）：以发布图像灰度均值为准，
# 须落在 120~170/255（KLT 特征密度下限），否则 VIO 前端无特征可跟。
# 该值与场地材质/灯光一起决定均值，换场地后须按实拍均值复核。
sensor_ev100 = 12.0
# 主视角 bloom 强度（0 关闭）；过高发灰、不通透。
bloom_intensity = 0.08

[env]
# 环境光贴图（IBL，半球渐变"天空"）：近黑高光面没有可反射的环境会像"吸光"，
# 这张渐变同时提供暗部补光与柔和反射。颜色 sRGB 0~1，intensity 缩放后单位 cd/m²。
# 色相接近中性（蓝只略高），避免给整场叠加蓝色偏移。
top = [0.72, 0.74, 0.78]
mid = [0.45, 0.46, 0.49]
bottom = [0.14, 0.14, 0.15]
intensity = 3000.0
