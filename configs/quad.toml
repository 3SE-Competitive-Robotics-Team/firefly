# 微无人机第三人称飞行（apps/quad）：独立 6-DOF 四旋翼，不接 IPC / VIO。
# 机体、旋翼布局与 PX4 控制参数见 crates/firefly-flight。

[control.rate]
# 240Hz 定步长 + 显式积分：内环比 1kHz 飞控进程保守，避免步长引入振荡。
p = [0.02, 0.02, 0.04]
i = [0.05, 0.05, 0.02]
d = [0.0, 0.0, 0.0]

[control.attitude]
# 姿态误差 → 角速度设定值（1/s），沿用旧手感。
p = [9.0, 9.0, 6.0]

[manual]
# 满油门 3 m/s 升降，垂直速度误差 → 加速度 4 1/s，满舵 3 rad/s 偏航。
climb_rate_max = 3.0
vz_kp = 4.0
yaw_rate_max = 3.0
